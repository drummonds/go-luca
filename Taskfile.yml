version: "3"

vars:
  BENCH_PG_CONTAINER: go-luca-bench-pg
  BENCH_PG_PORT: 15432
  BENCH_PG_PASSWORD: benchpass
  # Separate container for schema docs so a running benchmark is not disturbed
  DOCS_PG_CONTAINER: go-luca-docs-pg
  DOCS_PG_PORT: 15433
  DOCS_PG_DSN: "postgres://bench:{{.BENCH_PG_PASSWORD}}@localhost:{{.DOCS_PG_PORT}}/bench?sslmode=disable"

tasks:
  fmt:
    desc: Format code
    cmds:
      - go fmt ./...
      - go fix ./...

  vet:
    desc: Vet code
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  check:
    desc: Format, vet, lint, and test
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  deps:tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - go clean ./...

  benchmark:
    aliases: [bm]
    desc: Run Go benchmarks (pglike/SQLite)
    cmds:
      - go test -bench=. -benchmem ./...

  bench:pg:start:
    desc: Start PostgreSQL in podman (CONTAINER and PORT default to the benchmark ones)
    vars:
      CONTAINER: '{{.CONTAINER | default .BENCH_PG_CONTAINER}}'
      PORT: '{{.PORT | default .BENCH_PG_PORT}}'
    cmds:
      - |
        podman run --rm -d \
          --name {{.CONTAINER}} \
          -e POSTGRES_USER=bench \
          -e POSTGRES_PASSWORD={{.BENCH_PG_PASSWORD}} \
          -e POSTGRES_DB=bench \
          -p {{.PORT}}:5432 \
          docker.io/library/postgres:16-alpine
      - echo "Waiting for PG to be ready..."
      - |
        for i in $(seq 1 30); do
          podman exec {{.CONTAINER}} pg_isready -U bench -d bench 2>/dev/null && break
          sleep 0.5
        done
      - echo "PostgreSQL ready on port {{.PORT}}"

  bench:pg:stop:
    desc: Stop a PostgreSQL podman container (CONTAINER defaults to the benchmark one)
    vars:
      CONTAINER: '{{.CONTAINER | default .BENCH_PG_CONTAINER}}'
    cmds:
      - podman stop {{.CONTAINER}} || true

  bench:balance-types:
    desc: Run balance type comparison benchmark
    env:
      BENCH_PG_DSN: "postgres://bench:{{.BENCH_PG_PASSWORD}}@localhost:{{.BENCH_PG_PORT}}/bench?sslmode=disable"
    cmds:
      - go run ./cmd/bench-balance-types

  bench:compound-movements:
    desc: Run compound movement benchmark
    env:
      BENCH_PG_DSN: "postgres://bench:{{.BENCH_PG_PASSWORD}}@localhost:{{.BENCH_PG_PORT}}/bench?sslmode=disable"
    cmds:
      - go run ./cmd/bench-compound-movements

  bench:scv:
    desc: Run SCV generation benchmark
    env:
      BENCH_PG_DSN: "postgres://bench:{{.BENCH_PG_PASSWORD}}@localhost:{{.BENCH_PG_PORT}}/bench?sslmode=disable"
    cmds:
      - go run ./cmd/bench-scv

  bench:api:
    desc: Run direct vs API benchmark (no PG needed)
    cmds:
      - go run ./cmd/bench-api

  docs:build:
    desc: Build all documentation (markdown to HTML, schema, benchmarks)
    deps: [tbls:doc]
    cmds:
      - go run ./cmd/luca-docs

  # Schema docs come from a real PostgreSQL, not the pglike file: the
  # contract views use ::numeric, which pglike evaluates with functions
  # registered on its own connections, so tbls's SQLite cannot compile them.
  tbls:setup:
    desc: Load the schema and sample data into a throwaway PostgreSQL for tbls
    internal: true
    cmds:
      - go run ./cmd/luca-schema -pg "{{.DOCS_PG_DSN}}"

  tbls:doc:
    desc: Generate schema documentation with tbls (starts and stops a podman PostgreSQL)
    env:
      TBLS_DSN: '{{.DOCS_PG_DSN}}'
    cmds:
      - task: bench:pg:start
        vars: { CONTAINER: '{{.DOCS_PG_CONTAINER}}', PORT: '{{.DOCS_PG_PORT}}' }
      - defer: { task: bench:pg:stop, vars: { CONTAINER: '{{.DOCS_PG_CONTAINER}}' } }
      - task: tbls:setup
      - tbls doc --rm-dist -c .tbls.yml

  tbls:diff:
    desc: Check schema docs are up to date
    env:
      TBLS_DSN: '{{.DOCS_PG_DSN}}'
    cmds:
      - task: bench:pg:start
        vars: { CONTAINER: '{{.DOCS_PG_CONTAINER}}', PORT: '{{.DOCS_PG_PORT}}' }
      - defer: { task: bench:pg:stop, vars: { CONTAINER: '{{.DOCS_PG_CONTAINER}}' } }
      - task: tbls:setup
      - tbls diff -c .tbls.yml

  bench:all:
    desc: Run all benchmarks and regenerate docs
    cmds:
      - task: bench:api
      - task: bench:pg:start
      - defer: { task: bench:pg:stop }
      - task: bench:balance-types
      - task: bench:compound-movements
      - task: bench:scv
      - task: docs:build
